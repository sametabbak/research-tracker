name: Auto Categorize Analyses

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  categorize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run auto-categorizer
        run: python auto_categorizer.py

      - name: Commit results
        run: |
          git add data/analyses/
          if git diff --staged --quiet; then
            echo "No changes — all analyses already have keyword_group."
          else
            git commit -m "chore: auto-categorize ungrouped analyses"
            git push origin staging
            echo "Done. Open the review panel and approve."
          fi
