name: Research Center Price Tracker

on:
  schedule:
    # ── December window ──────────────────────────────
    - cron: '0 7 * 12 1'   # Every Monday in December
    - cron: '0 7 * 1  1'   # Every Monday in January
    - cron: '0 7 * 2  1'   # Every Monday in February
    # ── May window ───────────────────────────────────
    - cron: '0 7 * 5  1'   # Every Monday in May
    - cron: '0 7 * 6  1'   # Every Monday in June
    - cron: '0 7 * 7  1'   # Every Monday in July
    # ── Pre-window reminders ─────────────────────────
    - cron: '0 7 20 11 *'  # November 20 — "December window starts soon"
    - cron: '0 7 20 4  *'  # April 20    — "May window starts soon"

  workflow_dispatch:        # Manual trigger from GitHub UI anytime

permissions:
  contents: write
  pull-requests: write

jobs:
  track:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up staging branch
        run: |
          git fetch origin
          if git ls-remote --exit-code --heads origin staging; then
            # Branch exists — check it out and merge latest main to avoid drift
            git checkout staging
            git merge origin/main --no-edit --strategy-option=theirs || true
          else
            # First run — create staging from main
            git checkout -b staging
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        run: python tracker.py

      - name: Run sanitizer
        run: python sanitize.py

      - name: Run auto-categorizer
        run: python auto_categorizer.py

      - name: Commit and push to staging
        run: |
          git add data/ snapshots/
          if git diff --staged --quiet; then
            echo "Değişiklik yok — staging güncel."
          else
            git commit -m "chore: tracker run $(date '+%Y-%m-%d')"
            git push origin staging
            echo "✅ Değişiklikler staging branch'e gönderildi."
            echo "   İnceleme panelini açıp onaylayın: https://sametabbak.github.io/research-tracker/"
          fi
